version: 2

updates:
  - package-ecosystem: npm
    cooldown:
      default-days: 30
    open-pull-requests-limit: 10
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - "team-ow"
      - "review"
    ignore:
      # typescript-eslint has no release supporting TypeScript 7 yet
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      npm-dependencies:
        update-types:
          - "minor"
          - "patch"
