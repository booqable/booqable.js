version: 2

updates:
  - package-ecosystem: npm
    cooldown:
      default-days: 30
    open-pull-requests-limit: 10
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - "team-ow"
      - "review"
    groups:
      npm-dependencies:
        update-types:
          - "minor"
          - "patch"
